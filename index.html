<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEARL AI BOT - Монгол AI Туслах</title>
    <meta name="description" content="Монгол хэл дэмжих AI туслах. Үнэгүй чатбот сервис. OpenAI технологиор ажилладаг.">
    <meta name="keywords" content="ai, монгол, чатбот, openai, үнэгүй, бот">
    <style>
        /* Auto-growing textarea стиллүүд */
        .textarea-wrapper {
            flex: 1;
            position: relative;
        }

        #messageInput {
            width: 100%;
            min-height: 40px;
            max-height: 120px;
            padding: 10px 12px;
            border: none;
            border-radius: 20px;
            background: #2d3748;
            color: #e2e8f0;
            font-size: 0.9rem;
            outline: none;
            resize: none;
            overflow-y: auto;
            font-family: inherit;
            line-height: 1.4;
            transition: all 0.2s;
        }

        #messageInput:focus {
            box-shadow: 0 0 0 2px #74c7ec;
        }

        /* Textarea scrollbar стиль */
        #messageInput::-webkit-scrollbar {
            width: 4px;
        }

        #messageInput::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 2px;
        }

        #messageInput::-webkit-scrollbar-thumb {
            background: #74c7ec;
            border-radius: 2px;
        }

        #messageInput::-webkit-scrollbar-thumb:hover {
            background: #90cdf4;
        }

        /* Input container өөрчлөлт */
        .input-container {
            display: flex;
            padding: 12px;
            background: rgba(30, 41, 59, 0.9);
            gap: 8px;
            align-items: flex-end;
        }

        /* Нэвтрэлт цонхны стиллүүд */
        .login-content {
            max-width: 400px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h2 {
            color: #74c7ec;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .login-header p {
            color: #a3b3cc;
            font-size: 0.9rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-form .form-group label {
            color: #e2e8f0;
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: block;
        }

        .login-form .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #4a5568;
            border-radius: 8px;
            background: #2d3748;
            color: #e2e8f0;
            font-size: 0.9rem;
            transition: border-color 0.3s;
        }

        .login-form .form-group input:focus {
            border-color: #74c7ec;
            outline: none;
            box-shadow: 0 0 0 2px rgba(116, 199, 236, 0.2);
        }

        .login-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .login-btn, .register-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn {
            background: #74c7ec;
            color: #0f172a;
        }

        .login-btn:hover {
            background: #90cdf4;
            transform: translateY(-2px);
        }

        .register-btn {
            background: #4a5568;
            color: #e2e8f0;
        }

        .register-btn:hover {
            background: #5a6578;
            transform: translateY(-2px);
        }

        .login-footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.8rem;
            color: #a3b3cc;
        }

        .login-footer a {
            color: #74c7ec;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Хэрэглэгчийн мэдээлэл */
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        #userDisplayName {
            color: #74c7ec;
            font-weight: bold;
        }

        .logout-btn {
            padding: 5px 10px;
            background: #4a5568;
            color: #e2e8f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #5a6578;
        }

        /* Зогсоох товчны стиль */
        .stop-button {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            background: #f87171;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 8px;
        }

        .stop-button:hover {
            background: #ef4444;
        }

        /* Систем мессежийн стиль */
        .system-message {
            align-self: center;
            background: rgba(55, 65, 81, 0.5);
            color: #9ca3af;
            border-radius: 15px;
            text-align: center;
            max-width: 60%;
            margin: 5px auto;
            padding: 10px 15px;
        }

        .system-message .message-info {
            text-align: center;
        }

        /* Typewriter эффект */
        .streaming-message {
            position: relative;
        }

        .streaming-message::after {
            content: '|';
            animation: blink 1s infinite;
            color: #74c7ec;
            font-weight: bold;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Бодож байгаа индикаторын стиллүүд */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #313244;
            border-radius: 15px;
            align-self: flex-start;
            margin-bottom: 10px;
            color: #a3b3cc;
            font-style: italic;
            animation: fadeIn 0.3s ease;
        }

        .thinking-text {
            font-size: 0.9rem;
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #74c7ec;
            animation: thinkingBounce 1.5s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes thinkingBounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* Бусад стиллүүд өмнөх шигээ хадгалагдсан */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 15px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #74c7ec;
        }

        header p {
            font-size: 1rem;
            color: #a3b3cc;
        }

        main {
            display: flex;
            gap: 20px;
            height: 100%;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1e293b;
            max-height: calc(90vh - 200px);
        }

        /* Scrollbar стиль */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #2d3748;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #74c7ec;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #90cdf4;
        }

        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: #ebeeef;
            color: #0f172a;
            border-bottom-right-radius: 5px;
        }

        .bot-message {
            align-self: flex-start;
            background: #272840;
            color: #cdd6f4;
            border-bottom-left-radius: 5px;
        }

        .message-info {
            font-size: 0.75rem;
            margin-top: 4px;
            opacity: 0.7;
        }

        #sendButton {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            background: #74c7ec;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        #sendButton:hover {
            background: #90cdf4;
        }

        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stats-box, .api-config, .quick-actions {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .stats-box h3, .api-config h3, .quick-actions h3 {
            margin-bottom: 12px;
            color: #74c7ec;
            border-bottom: 1px solid #4a5568;
            padding-bottom: 8px;
            font-size: 1rem;
        }

        .stats-box p {
            margin: 8px 0;
            font-size: 0.9rem;
        }

        .api-config {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #apiKeyInput {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: #2d3748;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        #saveApiKey {
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: #74c7ec;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        #saveApiKey:hover {
            background: #90cdf4;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quick-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: #4a5568;
            color: #e2e8f0;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .quick-btn:hover {
            background: #74c7ec;
            color: #0f172a;
        }

        /* Модаль цонхны стиль */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: #1e293b;
            margin: 10% auto;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 10px;
        }

        .close:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #74c7ec;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #4a5568;
            border-radius: 6px;
            background: #2d3748;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        #saveKnowledgeBtn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #74c7ec;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #saveKnowledgeBtn:hover {
            background: #90cdf4;
        }

        /* Жижиг дэлгэцүүдэд зориулсан хариуцлагатай дизайн */
        @media (max-width: 900px) {
            .container {
                height: auto;
                min-height: 100vh;
            }
            
            main {
                flex-direction: column;
                height: auto;
            }
            
            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .stats-box, .api-config, .quick-actions {
                flex: 1;
                min-width: 250px;
            }
            
            .message {
                max-width: 85%;
            }
            
            .login-actions {
                flex-direction: column;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                gap: 10px;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
            
            header p {
                font-size: 0.9rem;
            }
            
            .stats-box, .api-config, .quick-actions {
                min-width: 100%;
            }
            
            .input-container {
                flex-direction: column;
            }
            
            #sendButton, #stopButton {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>
    <!-- Нэвтрэлт цонх -->
    <div id="loginModal" class="modal">
        <div class="modal-content login-content">
            <div class="login-header">
                <h2>⚪ PEARL AI BOT</h2>
                <p>Нэвтрэх эсвэл бүртгүүлэх</p>
            </div>
            
            <div class="login-form">
                <div class="form-group">
                    <label for="usernameInput">Иргэний бүртгэл регистрийн дугаар</label>
                    <input type="text" id="usernameInput" placeholder="Бүртгэлийн дугаараа оруулна уу...">
                </div>
                
                <div class="form-group">
                    <label for="passwordInput">Нууц үг:</label>
                    <input type="password" id="passwordInput" placeholder="Нууц үгээ оруулна уу...">
                </div>
                
                <div class="login-actions">
                    <button id="loginBtn" class="login-btn">Нэвтрэх</button>
                    <button id="registerBtn" class="register-btn"> Бүртгүүлэх</button>
                </div>
                
                <div class="login-footer">
                    <p>Нууц үгээ мартсан уу? <a href="#" id="forgotPassword">Энд дарж</a> сэргээнэ үү</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Гол апп контейнер -->
    <div class="container" id="appContainer" style="display: none;">
        <header>
            <h1>⚪ PEARL AI BOT</h1>
            <p>ХУРЛЫН ҮЗҰҰЛЭН</p>
            <div class="user-info">
                <span id="userDisplayName">Хэрэглэгч</span>
                <button id="logoutBtn" class="logout-btn">Гарах</button>
            </div>
        </header>

        <main>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- Энд мессежүүд харагдана -->
                </div>
                
                <div class="input-container">
                    <div class="textarea-wrapper">
                        <textarea id="messageInput" placeholder="Энд мессежээ бичнэ үү (Enter дарж илгээнэ үү)..." 
                                  rows="1" autocomplete="off"></textarea>
                    </div>
                    <button id="sendButton">Илгээх</button>
                    <button id="stopButton" class="stop-button" style="display: none;">ЗОГСООХ</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="stats-box">
                    <h3> Статистик</h3>
                    <div id="statsContent">
                        <p> Мессеж: <span id="messageCount">0</span></p>
                        <p> Мэдлэг: <span id="knowledgeCount">8</span></p>
                        <p> Хэрэглэгч: <span id="userCount">1</span></p>
                    </div>
                </div>

                <div class="api-config">
                    <h3>API Тохиргоо</h3>
                    <input type="password" id="apiKeyInput" placeholder="OpenAI API Key оруулах...">
                    <button id="saveApiKey"> Хадгалах</button>
                </div>

                <div class="quick-actions">
                    <h3>Хурдан үйлдлүүд</h3>
                    <button class="quick-btn" data-command="чи хэн бэ"> Чи хэн бэ</button>
                    <button class="quick-btn" data-command="юу хийж чадах вэ"> Юу хийж чадах вэ</button>
                    <button class="quick-btn" data-command="монгол үсэг">🇲🇳 Монгол үсэг</button>
                    <button class="quick-btn" id="addKnowledgeBtn">Мэдлэг нэмэх</button>
                    <button class="quick-btn" id="clearChatBtn"> Цэвэрлэх</button>
                    <button class="quick-btn" data-command="тусламж">Тусламж</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Мэдлэг нэмэх цонх -->
    <div id="knowledgeModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>🎓 Шинэ мэдлэг нэмэх</h2>
            <div class="form-group">
                <label for="questionInput">Асуулт (Монгол үсгээр):</label>
                <input type="text" id="questionInput" placeholder="Жишээ: сайн уу">
            </div>
            <div class="form-group">
                <label for="answerInput">Хариулт (Монгол үсгээр):</label>
                <textarea id="answerInput" placeholder="Жишээ: Сайн уу! Тавтай морил!" rows="4"></textarea>
            </div>
            <button id="saveKnowledgeBtn"> Хадгалах</button>
        </div>
    </div>

    <script>
        // Нэвтрэлт систем
        let currentUser = null;
        let isLoggedIn = false;

        // Мэдлэгийн сан - LocalStorage-с ачаалах
        let knowledgeBase = JSON.parse(localStorage.getItem('knowledgeBase')) || {
            "сайн уу": "🌟 Сайн уу! Миний сайхан хэрэглэгч! Тавтай морил! 🤗\nБи танд яаж туслах боломжтой вэ?",
            "баярлалаа": "❤️ Баярлалаа! Таны хүндэтгэлд баяртай байна! 🎉",
            "баяртай": "✨ Баяртай! Хүндэтгэсэн ярилцлагад баярлалаа! Дараа дахин уулзацгаая! 🌈",
            "чи хэн бэ": "🚀 Би бол таны AI туслах! Би танд:\n• Асуултанд хариулах\n• Шинэ мэдлэг нэмэх\n• Ярилцах боломжтой!",
            "юу хийж чадах вэ": "🎯 Би маш олон зүйл хийж чадна:\n• Асуултанд хариулах\n• Шинэ мэдлэг сурах\n• Ярилцах\n• Таньд туслах\nТа юу хүсэж байна вэ? 😊",
            "хэл": "💬 Би Монгол, Англи хэлээр ярилцах боломжтой!",
            "тусламж": "🆘 Тусламж:\n- Асуулт асуух\n- 'мэдлэг нэмэх' гэж бичих\n- 'статистик' харах\n- 'цэвэрлэх' гэж бичих",
            "үг": "📚 Би Монгол үсгийг бүрэн дэмждэг! Ү, ү, Ө, ө, Ң, ң зэрэг бүх үсэг ажиллана!"
        };

        // API Key - LocalStorage-с ачаалах
        let apiKey = localStorage.getItem('apiKey') || '';

        // Хувьсагчид
        let messageCount = parseInt(localStorage.getItem('messageCount')) || 0;
        let knowledgeCount = Object.keys(knowledgeBase).length;
        let currentRequestController = null; // Хүсэлтийг зогсоох контроллер

        // DOM элементүүд
        const loginModal = document.getElementById('loginModal');
        const appContainer = document.getElementById('appContainer');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const forgotPassword = document.getElementById('forgotPassword');
        const userDisplayName = document.getElementById('userDisplayName');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const stopButton = document.getElementById('stopButton');
        const messageCountElement = document.getElementById('messageCount');
        const knowledgeCountElement = document.getElementById('knowledgeCount');
        const userCountElement = document.getElementById('userCount');
        const addKnowledgeBtn = document.getElementById('addKnowledgeBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const knowledgeModal = document.getElementById('knowledgeModal');
        const closeModal = document.querySelector('.close');
        const saveKnowledgeBtn = document.getElementById('saveKnowledgeBtn');
        const questionInput = document.getElementById('questionInput');
        const answerInput = document.getElementById('answerInput');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveApiKey = document.getElementById('saveApiKey');

        // Auto-growing textarea функц
        function autoGrowTextarea(textarea) {
            // Reset height to auto to get the correct scrollHeight
            textarea.style.height = 'auto';
            
            // Set new height based on content
            const newHeight = Math.min(textarea.scrollHeight, 120); // Max 120px
            textarea.style.height = newHeight + 'px';
        }

        // Эхлэх үед нэвтрэлт цонх харуулах
        window.addEventListener('DOMContentLoaded', () => {
            // Хэрэглэгч нэвтрээгүй бол нэвтрэлт цонх харуулах
            if (!isLoggedIn) {
                loginModal.style.display = 'block';
                appContainer.style.display = 'none';
            }
            
            // API Key-г тохируулах
            apiKeyInput.value = apiKey;
            
            // Статистик шинэчлэх
            updateStats();
            
            usernameInput.focus();
        });

        // Нэвтрэх товчлуур
        loginBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (username && password) {
                // Энд бодит нэвтрэх логик байх ёстой
                // Одоогоор загвар логик ашиглаж байна
                currentUser = {
                    username: username,
                    displayName: username.split('@')[0] // Имэйл бол эхний хэсгийг ашиглах
                };
                
                isLoggedIn = true;
                
                // Нэвтрэлт цонх хаах
                loginModal.style.display = 'none';
                appContainer.style.display = 'flex';
                
                // Хэрэглэгчийн нэрийг харуулах
                userDisplayName.textContent = currentUser.displayName;
                
                // Welcome мессеж харуулах
                addSystemMessage(` ⚪ ${currentUser.displayName}⚪  тавтай морил! 
                
        Энэхүү систем нь Монгол улсын хиймэл оюун ухаант төрийн системлүү чиглүүлсэн demo хувилбар юм.
         Баруун талын хөнгөвчлөх товчнуудыг ашиглаж ерөнхий мэдээллийг авна уу!`);
                
                messageInput.focus();
            } else {
                alert('Бүртгэлийн дугаар болон нууц үгээ оруулна уу!');
            }
        });

        // Бүртгүүлэх товчлуур
        registerBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (username && password) {
                // Энд бодит бүртгүүлэх логик байх ёстой
                // Одоогоор загвар логик ашиглаж байна
                alert(`Бүртгэл үүсгэх хүсэлт илгээгдлээ! ${username} хаяг руу баталгаажуулах имэйл илгээгдсэн байна.`);
            } else {
                alert('Бүртгэлийн дугаар болон нууц үгээ оруулна уу!');
            }
        });

        // Нууц үг сэргээх
        forgotPassword.addEventListener('click', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            
            if (username) {
                alert(`${username} хаяг руу нууц үг сэргээх холбоос илгээгдлээ!`);
            } else {
                alert('Бүртгэлийн дугаараа оруулна уу!');
            }
        });

        // Гарах товчлуур
        logoutBtn.addEventListener('click', () => {
            if (confirm('Та системээс гарахдаа итгэлтэй байна уу?')) {
                currentUser = null;
                isLoggedIn = false;
                
                // Нэвтрэлт цонх харуулах
                loginModal.style.display = 'block';
                appContainer.style.display = 'none';
                
                // Хэрэглэгчийн талбаруудыг цэвэрлэх
                usernameInput.value = '';
                passwordInput.value = '';
                
                // Чат цэвэрлэх
                clearChat();
                
                usernameInput.focus();
            }
        });

        // API Key хадгалах
        saveApiKey.addEventListener('click', () => {
            apiKey = apiKeyInput.value.trim();
            localStorage.setItem('apiKey', apiKey);
            addSystemMessage('✅ API Key амжилттай хадгалагдлаа!');
        });

        // Textarea event listeners
        messageInput.addEventListener('input', function() {
            autoGrowTextarea(this);
        });

        // Enter дархад шинэ мөр нэмэхгүй, илгээх
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Shift+Enter дархад шинэ мөр нэмнэ
                    return;
                } else {
                    // Enter дархад мессеж илгээнэ
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // Мессеж илгээх функц
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (message === '') return;
            
            addUserMessage(message);
            messageInput.value = '';
            
            // Textarea өндрийг дахин тохируулах
            autoGrowTextarea(messageInput);
            
            // Зогсоох товчлуурыг идэвхжүүлэх
            stopButton.style.display = 'block';
            
            // Бодож байгаа мэт эффект харуулах
            showThinkingIndicator();
            
            // 1-2 секундын саатал нэмэх
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Бодож байгаа мэт эффект нуух
            hideThinkingIndicator();
            
            try {
                // Хүсэлтийн контроллер үүсгэх
                currentRequestController = new AbortController();
                const signal = currentRequestController.signal;
                
                const response = await getResponse(message, signal);
                addBotMessage(response);
            } catch (error) {
                if (error.name === 'AbortError') {
                    addSystemMessage('❌ Хүсэлт зогсоогдлоо');
                } else {
                    addBotMessage("😅 Уучлаарай, алдаа гарлаа. Дахин оролдоно уу?");
                    console.error("Алдаа:", error);
                }
            } finally {
                // Зогсоох товчлуурыг идэвхгүй болгох
                stopButton.style.display = 'none';
                currentRequestController = null;
            }
        }

        // Зогсоох товчлуур
        stopButton.addEventListener('click', () => {
            if (currentRequestController) {
                currentRequestController.abort();
                stopButton.style.display = 'none';
            }
        });

        // Бодож байгаа мэт эффект харуулах
        function showThinkingIndicator() {
            let indicator = document.createElement('div');
            indicator.id = 'thinkingIndicator';
            indicator.className = 'thinking-indicator';
            indicator.innerHTML = `
                <div class="thinking-text">💭 Бодож байна...</div>
                <div class="thinking-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            chatMessages.appendChild(indicator);
            scrollToBottom();
        }

        // Бодож байгаа мэт эффект нуух
        function hideThinkingIndicator() {
            const indicator = document.getElementById('thinkingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Хэрэглэгчийн мессеж нэмэх
        function addUserMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'user-message');
            messageElement.innerHTML = `
                <div>${formatMessage(message)}</div>
                <div class="message-info">👤 ${currentUser.displayName} · ${getCurrentTime()}</div>
            `;
            chatMessages.appendChild(messageElement);
            scrollToBottom();
            messageCount++;
            localStorage.setItem('messageCount', messageCount);
            updateStats();
        }

        // Ботын мессеж нэмэх
        function addBotMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'bot-message', 'streaming-message');
            messageElement.innerHTML = `
                <div class="message-content"></div>
                <div class="message-info">⚪ AI · ${getCurrentTime()}</div>
            `;
            chatMessages.appendChild(messageElement);
            scrollToBottom();
            
            // Үгүүдийг нэг нэгээр нь харуулах
            typewriterEffect(messageElement.querySelector('.message-content'), message);
        }

        // Систем мессеж нэмэх
        function addSystemMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'system-message');
            messageElement.innerHTML = `
                <div>${formatMessage(message)}</div>
                <div class="message-info">⚙️ Систем · ${getCurrentTime()}</div>
            `;
            chatMessages.appendChild(messageElement);
            scrollToBottom();
        }

        // Үгүүдийг нэг нэгээр нь харуулах эффект
        function typewriterEffect(element, text, speed = 20) {
            let i = 0;
            element.innerHTML = '';
            
            const typeInterval = setInterval(() => {
                if (i < text.length) {
                    // Дараагийн үгийг нэмэх
                    const char = text.charAt(i);
                    element.innerHTML += char === '\n' ? '<br>' : char;
                    i++;
                    scrollToBottom();
                } else {
                    clearInterval(typeInterval);
                    // Эффект дууссан бол streaming классыг хасах
                    element.closest('.message').classList.remove('streaming-message');
                }
            }, speed);
        }

        // Мессежийг форматлах (шинэ мөрүүдийг хадгалах)
        function formatMessage(message) {
            return message.replace(/\n/g, '<br>');
        }

        // Scroll доош чиглүүлэх
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Одоо цагийг авах
        function getCurrentTime() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        // Хариулт авах
        async function getResponse(message, signal) {
            const messageLower = message.toLowerCase().trim();
            
            // Тусгай командууд
            if (messageLower === 'статистик' || messageLower === 'stats') {
                return getStats();
            }
            
            if (messageLower === 'цэвэрлэх' || messageLower === 'clear') {
                clearChat();
                return "💬 Чат цэвэрлэгдлээ! 'сайн уу' гэж бичээд эхлүүлээрэй!";
            }
            
            if (messageLower === 'тусламж' || messageLower === 'help') {
                return knowledgeBase['тусламж'] || 'Тусламжийн мэдээлэл олдсонгүй';
            }
            
            // Монгол үсгийн тусгай асуултууд
            if (/[үөң]/.test(messageLower)) {
                if (messageLower.includes('үсэг') || messageLower.includes('үсг')) {
                    return "✅ Монгол үсэг бүрэн дэмжигддэг! Ү, ү, Ө, ө, Ң, ң зэрэг бүх үсэг ажиллана! 🎉";
                }
            }
            
            // Мэдлэгийн сангаас хариулт хайх
            if (knowledgeBase[messageLower]) {
                return knowledgeBase[messageLower];
            }
            
            // OpenAI API ашиглан хариулт авах
            if (apiKey) {
                return await getAIResponse(message, signal);
            } else {
                return "🔑 Таньд AI хариулт авахын тулд OpenAI API Key оруулах хэрэгтэй. Баруун талд байрлах 'API Тохиргоо' хэсэгт API Key-ээ оруулна уу.";
            }
        }

        // OpenAI API ашиглан хариулт авах
        async function getAIResponse(message, signal) {
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [
                            {
                                role: 'system',
                                content: 'Та бол Монгол хэлээр ярилцдаг AI туслах. Монгол үсэг (Ү, ү, Ө, ө, Ң, ң) бүрэн дэмжинэ. Богино, ойлгомжтой хариулт өг.'
                            },
                            {
                                role: 'user',
                                content: message
                            }
                        ],
                        max_tokens: 500,
                        temperature: 0.7
                    }),
                    signal: signal
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }
                
                return data.choices[0].message.content;
            } catch (error) {
                console.error('API Алдаа:', error);
                throw error;
            }
        }

        // Статистик авах
        function getStats() {
            return `📊 Статистик:\n• Нийт мессеж: ${messageCount}\n• Нийт мэдлэг: ${knowledgeCount}\n• Хэрэглэгч: 1`;
        }

        // Статистик шинэчлэх
        function updateStats() {
            messageCountElement.textContent = messageCount;
            knowledgeCountElement.textContent = knowledgeCount;
            userCountElement.textContent = isLoggedIn ? 1 : 0;
        }

        // Чат цэвэрлэх
        function clearChat() {
            chatMessages.innerHTML = '';
            messageCount = 0;
            localStorage.setItem('messageCount', messageCount);
            updateStats();
        }

        // Шинэ мэдлэг нэмэх
        function addKnowledge() {
            const question = questionInput.value.trim();
            const answer = answerInput.value.trim();
            
            if (question && answer) {
                knowledgeBase[question.toLowerCase()] = answer;
                knowledgeCount++;
                
                // LocalStorage-д хадгалах
                localStorage.setItem('knowledgeBase', JSON.stringify(knowledgeBase));
                
                updateStats();
                
                // Модаль хаах
                knowledgeModal.style.display = 'none';
                questionInput.value = '';
                answerInput.value = '';
                
                // Амжилттай нэмсэн мэдээлэл өгөх
                addSystemMessage("✅ Шинэ мэдлэг амжилттай нэмэгдлээ! 🎉");
            } else {
                alert('Асуулт болон хариултыг бөглөнө үү!');
            }
        }

        // Үйлдэлд event listener үүсгэх
        sendButton.addEventListener('click', sendMessage);

        // Хурдан товчлуурууд
        document.querySelectorAll('.quick-btn').forEach(button => {
            if (button.id !== 'addKnowledgeBtn' && button.id !== 'clearChatBtn') {
                button.addEventListener('click', () => {
                    messageInput.value = button.getAttribute('data-command');
                    sendMessage();
                });
            }
        });

        // Мэдлэг нэмэх товчлуур
        addKnowledgeBtn.addEventListener('click', () => {
            knowledgeModal.style.display = 'block';
            questionInput.focus();
        });

        // Чат цэвэрлэх товчлуур
        clearChatBtn.addEventListener('click', () => {
            clearChat();
            addSystemMessage("💬 Чат цэвэрлэгдлээ! 'сайн уу' гэж бичээд эхлүүлээрэй!");
        });

        // Модаль хаах
        closeModal.addEventListener('click', () => {
            knowledgeModal.style.display = 'none';
        });

        // Модаль гадна дээр дархад хаах
        window.addEventListener('click', (e) => {
            if (e.target === knowledgeModal) {
                knowledgeModal.style.display = 'none';
            }
        });

        // Мэдлэг нэмэх хадгалах товчлуур
        saveKnowledgeBtn.addEventListener('click', addKnowledge);

        // Enter дарж модал дотор хадгалах
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                answerInput.focus();
                e.preventDefault();
            }
        });

        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                addKnowledge();
                e.preventDefault();
            }
        });
    </script>
</body>
